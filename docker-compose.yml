services:
  wordpress:
    image: wordpress:php8.2-apache
    container_name: rg-ru-wordpress
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./wp-content/themes/rubex:/var/www/html/wp-content/themes/rubex
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: shared-mysql:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: rg_ru
      WORDPRESS_TABLE_PREFIX: rubex_
    networks:
      - shared-net

networks:
  shared-net:
    external: true
